name: VPNGate Health Check

on:
  schedule:
    - cron: '0 */4 * * *'  # 每 4 小时自动触发一次测活
  workflow_dispatch:      # 允许在 GitHub 界面手动点击触发

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Run Health Check Script
        run: |
          python check_vpngate.py

      - name: Commit & Push Live Nodes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live_vpngate.yaml
          git commit -m "auto: update live 10 JP & 10 KR vpngate nodes" || exit 0
          git push
